<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="校园签到系统图标">
  <defs>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b3a66" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b63b3"/>
      <stop offset="1" stop-color="#0a86d8"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块（深色，便于白色图形在白底上分明） -->
  <rect x="6" y="6" width="116" height="116" rx="18" fill="url(#bgGrad)" filter="url(#drop)"/>

  <!-- 白色学校建筑剪影 -->
  <g transform="translate(10,10)" fill="#ffffff" stroke="rgba(255,255,255,0.06)" stroke-width="0.8">
    <!-- 屋顶 -->
    <path d="M18 34 L46 10 L74 34 L18 34 Z"/>
    <!-- 建筑主体 -->
    <rect x="16" y="34" width="56" height="46" rx="6"/>
    <!-- 门 -->
    <rect x="40" y="58" width="14" height="22" rx="3" fill="#f7fbff"/>
    <!-- 窗格（浅色，以保持简洁） -->
    <g fill="#dff3ff">
      <rect x="22" y="42" width="10" height="10" rx="1.5"/>
      <rect x="48" y="42" width="10" height="10" rx="1.5"/>
      <rect x="22" y="56" width="10" height="10" rx="1.5"/>
      <rect x="48" y="56" width="10" height="10" rx="1.5"/>
    </g>
    <!-- 校旗（小） -->
    <rect x="68" y="6" width="2.8" height="18" fill="#ffffff"/>
    <path d="M71 8 L79 11.6 L71 15.2 Z" fill="#ffd25b"/>
  </g>

  <!-- 签到勾徽章（突出，放在右上角） -->
  <g transform="translate(78,18)">
    <circle cx="22" cy="22" r="22" fill="#28d07a" stroke="#18b763" stroke-width="1.6" />
    <path d="M13 22.5 L19 28.5 L31 16" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>