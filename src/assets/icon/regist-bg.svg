<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="校园签到背景">
  <defs>
    <linearGradient id="g_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="0.45" stop-color="#dff3ff"/>
      <stop offset="1" stop-color="#f7fff8"/>
    </linearGradient>

    <linearGradient id="g_sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>

    <linearGradient id="g_hill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8e6c9"/>
      <stop offset="1" stop-color="#9fd7a8"/>
    </linearGradient>

    <pattern id="p_grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="rgba(11,99,179,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#g_sky)"/>

  <g transform="translate(1560,140)">
    <circle r="84" fill="url(#g_sun)"/>
    <circle r="160" fill="rgba(255,214,120,0.06)"/>
  </g>

  <g transform="translate(0,420)">
    <rect x="0" y="220" width="1920" height="440" fill="#f6fff2"/>
    <path d="M0 260 C200 180 520 180 760 260 C1040 340 1360 300 1920 260 L1920 660 L0 660 Z" fill="url(#g_hill)"/>
  </g>

  <g transform="translate(160,360)" fill="#ffffff" opacity="0.98">
    <rect x="360" y="40" width="360" height="220" rx="12"/>
    <rect x="120" y="110" width="160" height="150" rx="10"/>
    <rect x="1000" y="130" width="160" height="130" rx="10"/>
    <path d="M320 40 L540 -24 L680 40 Z"/>
    <g fill="#eaf6ff">
      <rect x="420" y="90" width="40" height="40" rx="4"/>
      <rect x="480" y="90" width="40" height="40" rx="4"/>
      <rect x="540" y="90" width="40" height="40" rx="4"/>
    </g>
    <g transform="translate(280,210)">
      <circle cx="0" cy="0" r="28" fill="#eaf9ee"/>
      <rect x="-6" y="0" width="12" height="26" fill="#fff"/>
    </g>
    <g transform="translate(1160,210)">
      <circle cx="0" cy="0" r="32" fill="#eaf9ee"/>
      <rect x="-8" y="0" width="16" height="28" fill="#fff"/>
    </g>
  </g>

  <path d="M520 700 C700 760 920 760 1100 700" fill="none" stroke="rgba(11,99,179,0.04)" stroke-width="6" stroke-linecap="round"/>

  <rect width="1920" height="1080" fill="url(#p_grid)" opacity="0.04"/>
</svg>